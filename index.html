function renderEp2Cards(){const labels=['左牌','右牌'];const cards=[0,1].map(i=>{const shown=drive.cardClueSlot===i,sun=i===drive.sunSlot,face=shown?(sun?'☀ 太陽活命牌':'☠ 死神鬼牌'):'牌背';return `<button class="action card-choice ${shown?(sun?'sun-card':'death-card'):''}" data-do="ep2Card${i}" aria-label="選擇${labels[i]}"><span class="card-back ${shown?(sun?'sun-card':'death-card'):''}">${face}${shown&&!sun?'<i>骷髏・血痕</i>':''}</span><small>${labels[i]}　/　手把 ${i===0?'B':'A'}</small></button>`}).join('');overlay.innerHTML=`<section class="panel ep2-panel card-panel"><div class="eyebrow">第三幕　/　生死抽鬼牌</div><h1 class="subhead">第 ${drive.cardRound} / ${drive.cardMaxRounds} 輪</h1><p class="bodycopy">笑死郎說：「太陽牌代表生路，連續兩輪抽中才能離開。死神牌會扣兩顆心，然後重新洗牌。」</p><div class="card-goal"><span>【通關條件：連續 2 輪選中「太陽牌」即可獲勝（當前進度：${drive.cardRound===1?0:1} / 2）】</span></div><div class="card-progress">包贏輸　${'❤️'.repeat(drive.hp)}${'♡'.repeat(Math.max(0,5-drive.hp))}　｜　💊 x ${drive.pills}</div><div class="card-penalty" ${drive.cardFeedback.startsWith('死神牌！')?'':'hidden'}>死神牌：扣除兩顆心，已重新洗牌。請重新挑戰本輪。</div><div class="clown-tell ${drive.cardFeedback.startsWith('死神牌！')?'death-tell':''}">${drive.cardFeedback}</div><div class="row ep2-cards">${cards}</div><div class="row pill-row"><button class="action" data-do="ep2UsePill" ${drive.pills<=0||drive.cardClueSlot!==null?'disabled':''}>↑ 使用鎮定藥丸　（剩 ${drive.pills} 顆）</button></div><div class="meta"><span>按 B 選左牌</span><span>按 A 選右牌</span></div></section>`}

  function pollGamepad() {
    if (!navigator.getGamepads) return;
    let gp = null;
    for (const candidate of navigator.getGamepads()) if (candidate) { gp = candidate; break; }
    if (!gp) { padPrevious = []; padDirectionPrevious = { up: false, down: false }; padAxisX = padAxisY = 0; for (const dir of ['left', 'right', 'up', 'down']) keys.delete(dir); return; }
    const pressed = index => !!gp.buttons[index]?.pressed;
    const edge = index => pressed(index) && !padPrevious[index];
    const x = gp.axes?.[0] || 0, y = gp.axes?.[1] || 0;
    const upNow = pressed(12) || y < -.55;
    const downNow = pressed(13) || y > .55;
    const resultMode = state && ['clear', 'fail'].includes(state.mode);
    if (upNow && !padDirectionPrevious.up) { if (resultMode) moveResultChoice(-1); else checkStair(true); }
    if (downNow && !padDirectionPrevious.down) { if (resultMode) moveResultChoice(1); else checkElevator(); }
    if (resultMode && pressed(14) && !padPrevious[14]) moveResultChoice(-1);
    if (resultMode && pressed(15) && !padPrevious[15]) moveResultChoice(1);
    if (resultMode && Math.abs(x) > .55 && Math.abs(padAxisX) <= .55) moveResultChoice(x < 0 ? -1 : 1);
    padDirectionPrevious = { up: upNow, down: downNow };
    if (Math.abs(x) > .28 || pressed(14) || pressed(15)) keys.add(x < -.28 || pressed(14) ? 'left' : 'right');
    else { keys.delete('left'); keys.delete('right'); }
    if (Math.abs(y) > .28 || pressed(12) || pressed(13)) keys.add(y < -.28 || pressed(12) ? 'up' : 'down');
    else { keys.delete('up'); keys.delete('down'); }
    if (edge(gamepadMap.confirm)) pressA();
    if (edge(gamepadMap.dodge)) pressB();
    if (edge(gamepadMap.plus)) {
      if (state.mode === 'pause') state.mode = state.pauseFrom;
      else if (state.mode === 'fail') restart();
      else if (state.mode === 'clear') exit();
      else { state.pauseFrom = state.mode; state.mode = 'pause'; }
    }
    padPrevious = gp.buttons.map(button => button.pressed);
    padAxisX = x; padAxisY = y;
  }

      state.timer = Math.max(0, state.timer - dt * 24);

      if (state.floor === 1 && state.tutorialTimer > 0 && !state.tutorialShown) state.tutorialTimer = Math.max(0, state.tutorialTimer - dt);
      state.shieldCD = Math.max(0, state.shieldCD - dt);
      state.shieldT = Math.max(0, state.shieldT - dt);
      if (state.floor === 2 || state.floor === 3) {
        state.flickerT -= dt;
        if (state.flickerT <= 0) { state.blankDoor = Math.floor(Math.random() * (DOORS[state.floor].length - 1)); state.flickerT = 4.5 + Math.random() * 3.5; window.setTimeout(() => { if (state) state.blankDoor = -1; }, 1350); }

        else { state.rotationCD -= dt; if (state.rotationCD <= 0) { state.rotationT = 3.6; state.rotationCD = 11 + Math.random() * 5; reversedSting(); toast('上下顛倒！閻姐名片能替你擋下下一陣黑霧。'); } }
        state.fogT -= dt;
        if (state.fogT <= 0) { state.fogT = 6 + Math.random() * 2; state.fogX = 85 + Math.random() * 310; state.fogActive = 2.6; state.fogHit = false; }
        if (state.fogActive > 0) {
          state.fogActive = Math.max(0, state.fogActive - dt);
          if (!state.fogHit && Math.abs(state.x - state.fogX) < 40 && state.shieldT <= 0) {
            state.fogHit = true; state.hp = Math.max(0, state.hp - 1); state.timer = Math.max(0, state.timer - 120); state.shake = .4;
            toast('灰色黑霧纏住手腕！按 B 亮出閻姐名片。'); tone(58, .32, 'sawtooth', .07); burst(state.x, state.y, '#a5a7a3', 18);
            if (state.hp <= 0) fail('5 樓黑霧吞掉了最後一顆心。');
          }
        }
      }
      let dx = (directionDown('right') ? 1 : 0) - (directionDown('left') ? 1 : 0);
      let dy = (directionDown('down') ? 1 : 0) - (directionDown('up') ? 1 : 0);
      if (state.floor === 5 && state.rotationT > 0) { dx *= -1; dy *= -1; }
      if (dx || dy) {

        state.x = Math.max(34, Math.min(448, state.x + dx / norm * 104 * dt));
        state.y = Math.max(142, Math.min(220, state.y + dy / norm * 90 * dt));

    } else if (state.mode === 'elevator') {
      state.elevatorT -= dt;
      if (state.elevatorT <= 0) {
        state.hp = Math.max(0, state.hp - 1); state.timer = Math.max(0, state.timer - 300); state.shake = .5;
        toast('羊奶籃沒卡住，電梯門夾傷了你！−1 ❤️，−5 分鐘。'); tone(62, .4, 'sawtooth', .075);

    } else if (state.mode === 'transition') {

      state.endingT += dt;

    if (root) root.classList.toggle('c3-rotated', state.floor === 5 && state.rotationT > 0);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 24 * dt; p.life -= dt; }

  }

    if (state.mode === 'elevator') {
      const pulse = Math.sin(state.visualTime * 22) > 0;
      rect(12, 128, 38, 84, pulse ? '#921e2d' : '#242832');
      rect(14, 169, 34, 4, '#c7ba9f'); rect(14, 177, 34, 4, '#c7ba9f');
      if (state.elevatorSaved) { rect(12, 167, 40, 4, '#e6d496'); rect(12, 177, 40, 4, '#e6d496'); }
    }
    drawFog(); drawBao();
    for (const p of particles) { ctx.globalAlpha = Math.min(1, p.life * 1.5); rect(p.x, p.y, p.size, p.size, p.color); }
    ctx.globalAlpha = 1;
    if (state.floor <= 3) for (const drop of rain) rect(drop.x, drop.y, 1, drop.len, '#a6d1db42');
    if (state.floor === 4) { ctx.fillStyle = '#9f162022'; ctx.fillRect(0, 0, W, H); }
    if (state.rotationT > 0) {
      ctx.fillStyle = `rgba(105,180,181,${.08 + Math.sin(state.visualTime * 20) * .04})`; ctx.fillRect(0, 0, W, H);
      text('空間顛倒　/　抓緊方向', 240, 48, 10, '#d8fff2', 'center');
    }
    if (state.tutorialTimer > 0 && state.floor === 1 && state.mode === 'floor') {
      rect(153, 87, 174, 23, '#0b1018e8'); text(`交班教學　${Math.ceil(state.tutorialTimer)} 秒　→　101 號房`, 240, 102, 7, '#ffe09a', 'center');
    }
    if (state.mode === 'floor' && floorComplete() && state.floor < 5) {
      text('本層訂單完成　前往電梯 ↓ 或安全梯 ↑', 240, 248, 7, '#e8d297', 'center');
    }
    if (state.shake > 0) { ctx.save(); ctx.translate((Math.random() - .5) * 5, (Math.random() - .5) * 4); ctx.restore(); }
  }

  function tick(now) {
    if (!root || !state) return;
    const dt = Math.min(.04, (now - last) / 1000); last = now;
    pollGamepad(); update(dt); draw(); raf = requestAnimationFrame(tick);
  }

  function launchFromMenu(event) {
    const lockedButton = event.target.closest('[data-c3-locked]');
    if (lockedButton) {
      event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation();
      window.alert('需先通關前置章節方可解鎖');
      return;
    }
    const startButton = event.target.closest('[data-c3-start]');
    if (!startButton) return;
    event.preventDefault(); event.stopPropagation(); event.stopImmediatePropagation();
    start(startButton.closest('.ep2-end-panel') ? 'ep2' : 'chapters');
  }

  function initialize() {
    menuObserver(); injectStyles();
    document.addEventListener('click', launchFromMenu, true);
  }

  window.GameChapter3 = Object.freeze({ start, exit, getSnapshot: () => state ? ({ mode: state.mode, floor: state.floor, hp: state.hp, timer: state.timer, delivered: state.delivered, target: getTarget(), elevatorTaps: state.elevatorTaps, rotationT: state.rotationT, shieldT: state.shieldT }) : null });
  initialize();
})();

</script>
