function setMusicScene(scene){if(musicScene===scene)return;musicScene=scene;musicBeat=0;if(musicTimer)clearInterval(musicTimer);musicTimer=0;try{const a=audio();if(!a)return;if(a.sceneNodes){for(const n of a.sceneNodes){try{n.stop()}catch{}}}a.sceneNodes=[];const track=musicTracks[scene]||musicTracks.title;for(const [hz,wave,gain] of track.tones){const o=a.createOscillator(),g=a.createGain();o.type=wave;o.frequency.value=hz;g.gain.value=gain;o.connect(g);g.connect(a.master);o.start();a.sceneNodes.push(o)}musicTimer=setInterval(()=>{if(!options.sound)return;const note=track.seq[musicBeat%track.seq.length];if(note)playBeep(note,.13,track.wave,track.gain);if(scene==='boss'&&musicBeat%4===0)playBeep(48,.09,'sawtooth',.025);if(scene==='warehouse'){const dist=Math.abs(player.x-326),near=dist<75,period=near?3:dist<145?5:8;if(musicBeat%period===0)playBeep(38,.26,'sawtooth',near ? .045 : .026);if(musicBeat%8===5)playBeep(near?73.4:55,.2,'triangle',near ? .025 : .014);if(near&&musicBeat%16===14)playBeep(311,.09,'square',.012)}musicBeat++},track.tempo)}catch{}}

 for(const o of drive.obstacles)o.z+=dt*(final ? .22 : .24);for(let i=drive.obstacles.length-1;i>=0;i--){const o=drive.obstacles[i];if(o.z>.84&&o.z<1.08&&Math.abs(drive.carX-o.lane)<.58&&drive.invuln<=0){drive.hp--;drive.invuln=1.35;visualImpact('injury',.85,.32);spawnParticles(240,204,13,'#e24649',1.1);playBeep(64,.24,'sawtooth',.075);sayToast(o.type==='car'?'前車急煞！你擦撞了護欄。':'車輪壓過坑洞，方向盤猛地偏了一下。',1.7);if(drive.hp<=0){failEp2('車子失控停在路肩。笑死郎替你接下了這趟單。');return}}if(o.z>1.16)drive.obstacles.splice(i,1)}
 if(!final&&drive.elapsed>=drive.duration){mode='ep2Call';drive.callT=5.4;drive.radioT=0;overlay.classList.remove('open');setMusicScene('ep2ending');visualImpact('reveal',1.15,.48);playBeep(740,.13,'square',.1);setTimeout(()=>playBeep(880,.13,'square',.1),170);setTimeout(()=>playBeep(1046,.2,'square',.1),340);setHUD();return}
 if(final&&drive.elapsed>=drive.duration){mode='ep2Ending';drive.endingT=6.8;drive.coinBurst=false;setMusicScene('ep2ending');visualImpact('reveal',1.45,.66);spawnParticles(250,123,90,'#ff6b39',2.4);return}
 }
 else if(mode==='ep2Call'){drive.callT-=dt;if(drive.callT<=0){mode='ep2Cards';drive.breathClue=false;drive.breathUsed=false;renderOverlay();setHUD()}}
 else if(mode==='ep2Ending'){drive.endingT-=dt;if(!drive.coinBurst&&drive.endingT<5.8){drive.coinBurst=true;spawnCoins(242,166,190);spawnParticles(240,100,130,'#ebae4b',2.1)}if(Math.random()<.62)spawnParticles(150+Math.random()*190,85+Math.random()*115,2,'#c9c4bb',.7);if(drive.endingT<=0)finishEp2()}
}

function tick(now){const dt=Math.min(.04,(now-last)/1000);last=now;updateDialogue(dt);updateEffects(dt);updateEp2(dt);updateAudit(dt);updateWarehouseMoan(now);updateDoorbell(dt);movement(dt);pollGamepad();requestAnimationFrame(tick)}
function moveMenu(d){if(mode==='play')return;const bs=[...overlay.querySelectorAll('button:not(:disabled)')];if(!bs.length)return;let at=bs.indexOf(document.activeElement);if(at<0){at=bs.findIndex(b=>b.classList.contains('menu-selected'));if(at<0)at=Math.min(menuIndex,bs.length-1)}menuIndex=(at+d+bs.length)%bs.length;bs.forEach(b=>b.classList.remove('menu-selected'));bs[menuIndex].classList.add('menu-selected');bs[menuIndex].focus()}
function updatePadTelemetry(gp){const node=$('#pad-telemetry');if(!node)return;if(!gp){node.textContent=navigator.getGamepads?'遊戲手把未連線；按一下按鈕喚醒。':'此瀏覽器沒有提供 Gamepad API。';return}const down=[];gp.buttons.forEach((b,i)=>{if(b.pressed||b.value>.12)down.push(i+(b.value>.15?':'+b.value.toFixed(1):''))});node.textContent='遊戲手把已連線　'+(gp.mapping==='standard'?'標準映射':'自訂映射')+'　'+(down.length?'按下：'+down.join(' · '):'無按鍵輸入')+'　類比 '+((gp.axes?.[0]||0).toFixed(2))+', '+((gp.axes?.[1]||0).toFixed(2))}
 function pollGamepad(){if(!navigator.getGamepads){currentGamepad=null;updatePadTelemetry(null);return}const list=navigator.getGamepads();let gp=null;for(const g of list)if(g){gp=g;break}currentGamepad=gp;if(gp){const first=padStatus==='遊戲手把未連線';padStatus='遊戲手把已連線';if(first){playBeep(500,.1,'sine');if(mode==='title'||mode==='settings'||mode==='gamepad')renderOverlay()}if(mode==='gamepad')updatePadTelemetry(gp);const ax=gp.axes&&gp.axes.length?gp.axes[0]:0,ay=gp.axes&&gp.axes.length>1?gp.axes[1]:0,l=gp.buttons[14]?.pressed,r=gp.buttons[15]?.pressed;padInput=(ax<-.28||l?-1:ax>.28||r?1:0);const pressed=i=>!!gp.buttons[i]?.pressed,edge=i=>pressed(i)&&!padPrev[i];if(mode==='ep2Drive'||mode==='ep2FinalDrive')drive.look=mode==='ep2Drive'&&pressed(options.gamepadMap.look??5);
 if(mode==='audit'){if(edge(14))adjustAudit(-1);if(edge(15))adjustAudit(1);if(Math.abs(ax)>.55&&auditAxisLock===0){adjustAudit(ax>0?1:-1);auditAxisLock=Math.sign(ax)}else if(Math.abs(ax)<.25)auditAxisLock=0;if(edge(options.gamepadMap.confirm))confirmAudit();padPrev=gp.buttons.map(b=>b.pressed);return}
 if(waitingForMap){const idx=gp.buttons.findIndex((b,i)=>b.pressed&&!padPrev[i]);if(idx>=0){options.gamepadMap[waitingForMap]=idx;waitingForMap='';saveOptions();padPrev=gp.buttons.map(b=>b.pressed);renderOverlay();return}}
 if(!waitingForMap&&mode!=='play'&&overlay.classList.contains('open')){const left=edge(14),right=edge(15),up=edge(12),down=edge(13);if(left)moveMenu(-1);else if(right)moveMenu(1);else if(Math.abs(ax)>.65&&padMenuX===0){moveMenu(ax>0?1:-1);padMenuX=Math.sign(ax)}else if(Math.abs(ax)<.25)padMenuX=0;if(up)moveMenu(-1);else if(down)moveMenu(1);else if(Math.abs(ay)>.65&&padMenuY===0){moveMenu(ay>0?1:-1);padMenuY=Math.sign(ay)}else if(Math.abs(ay)<.25)padMenuY=0}
 if(edge(options.gamepadMap.confirm)){if(mode==='play'){if(flow==='boss')attack();else interact()}else if(mode!=='audit'&&overlay.classList.contains('open')){const b=overlay.querySelector('button:focus')||overlay.querySelector('.primary')||overlay.querySelector('[data-do]');if(b)b.click()}}
 if(edge(options.gamepadMap.dodge)&&mode==='play')dash();if(edge(options.gamepadMap.plus)){if(mode==='dead')restart();else if(mode==='end')startEp2();else if(mode==='ep2Fail')retryEp2();else if(mode==='play'&&!dlg){mode='pause';renderOverlay()}else if(mode==='ep2Drive'||mode==='ep2FinalDrive'){ep2PausedFrom=mode;mode='ep2Pause';renderOverlay()}}
 padPrev=gp.buttons.map(b=>b.pressed)}else{padInput=0;drive.look=false;padStatus='遊戲手把未連線';padPrev=[];padMenuY=0;padMenuX=0;updatePadTelemetry(null)}}
 window.addEventListener('gamepadconnected',e=>{padStatus='遊戲手把已連線';currentGamepad=e.gamepad;if(mode==='title'||mode==='settings'||mode==='gamepad')renderOverlay()});window.addEventListener('gamepaddisconnected',()=>{currentGamepad=null;padStatus='遊戲手把未連線';padPrev=[];if(mode==='title'||mode==='settings'||mode==='gamepad')renderOverlay()});
window.addEventListener('keydown',e=>{if(mode!=='audit')return;if(['ArrowLeft','ArrowRight','Enter',' ','e','E'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation();if(e.key==='ArrowLeft')adjustAudit(-1);else if(e.key==='ArrowRight')adjustAudit(1);else confirmAudit()}else e.stopImmediatePropagation()},true);
window.addEventListener('keydown',e=>{const k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Space'].includes(k))e.preventDefault();keys[k]=true;if((k==='+'||k==='=')&&mode==='dead'){restart();return}if((k==='+'||k==='=')&&mode==='end'){startEp2();return}if((k==='+'||k==='=')&&mode==='ep2Fail'){retryEp2();return}if(k==='Escape'){if(waitingForMap){waitingForMap='';renderOverlay()}else if(mode==='play'&&!dlg){mode='pause';renderOverlay()}else if(mode==='pause'){mode='play';overlay.classList.remove('open')}else if(mode==='ep2Drive'||mode==='ep2FinalDrive'){ep2PausedFrom=mode;mode='ep2Pause';renderOverlay()}return}if(k==='Enter'||k===' '){if(mode==='play'){if(flow==='boss')attack();else interact()}else if(overlay.classList.contains('open')){const b=overlay.querySelector('button:focus')||overlay.querySelector('[data-do]');if(b)b.click()}return}if(k==='e'||k==='E'){interact();return}if(k==='Shift')dash();if(mode!=='play'&&overlay.classList.contains('open')){if(k==='ArrowLeft')moveMenu(-1);else if(k==='ArrowRight')moveMenu(1);else if(k==='ArrowDown')moveMenu(1);else if(k==='ArrowUp')moveMenu(-1)}});window.addEventListener('keyup',e=>{keys[e.key]=false});
document.querySelectorAll('.touchbtn').forEach(b=>{const h=b.dataset.hold,a=b.dataset.action;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(h){if(mode==='audit')adjustAudit(h==='left'?-1:1);else keys[h]=true}if(a==='interact'){if(mode==='audit')confirmAudit();else if(flow==='boss')attack();else interact()}if(a==='dash'){if(mode==='audit')adjustAudit(-1);else dash()}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(h)keys[h]=false})});
canvas.addEventListener('pointerdown',()=>{if(dlg)nextDialogue()});$('#dialogue').addEventListener('pointerdown',e=>{if(dlg){e.preventDefault();nextDialogue()}});
if(save&&save.complete){}setHUD();renderOverlay();requestAnimationFrame(draw);requestAnimationFrame(tick);
})();
